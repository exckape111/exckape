<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>exckapeworkshop — галерея эффектов</title><meta name="description" content="exckapeworkshop — галерея эффектов изображений"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./" aria-label="exckapeworkshop — галерея эффектов"><img src="./logo.png?v=2" alt=""></a><span class="tag">галерея эффектов</span><button id="export" class="red">скачай png ↗</button></header><main><aside><div class="section source-section"><span>источник</span><button id="upload">загрузи изображение +</button><input id="file" type="file" accept="image/*" hidden></div><div class="section"><span>эффекты</span><p class="muted">сочетай эффекты и создай свой стиль.</p><div id="effects"></div></div><div class="section"><span>палитра</span><div class="colors"><label>чернила<input type="color" id="ink" value="#f5f5f7"></label><label>бумага<input type="color" id="paper" value="#111111"></label></div><label class="check"><input type="checkbox" id="transparent"> прозрачный фон</label><button id="reset" class="quiet">сбрось настройки</button></div></aside><section class="workspace"><div class="toolbar"><span id="sourceName">пусто</span><button id="compare" aria-pressed="false">покажи оригинал</button></div><div id="dropzone"><canvas id="canvas" aria-label="Processed artwork preview"></canvas></div><div class="zoom-bar" role="group" aria-label="Preview zoom"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomReadout" aria-live="polite">Fit</span><select id="zoomSelect" aria-label="Zoom preset"><option value="fit">По размеру окна</option><option value="50">50%</option><option value="100">100%</option><option value="200">200%</option><option value="400">400%</option><option value="custom" disabled>свой масштаб</option></select><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomFit">По размеру</button></div><footer><span id="stat
